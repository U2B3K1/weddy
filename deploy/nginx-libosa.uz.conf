# Libosa — https://libosa.uz
# frontend/dist statik + /api/, /admin/ proxysi gunicorn ga + /static/ va /media/ fayllari.
# Bu faylni serverga qo'yish: /etc/nginx/sites-available/libosa.uz  (keyin symlink)

# HTTP → faqat certbot tekshiruvi, qolgani HTTPSga o'tadi.
server {
    listen 80;
    listen [::]:80;
    server_name libosa.uz www.libosa.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name libosa.uz www.libosa.uz;

    # certbot --nginx shu ikki qatorni o'zi to'ldiradi
    ssl_certificate     /etc/letsencrypt/live/libosa.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/libosa.uz/privkey.pem;

    client_max_body_size 20m;   # rasmlar 10MB gacha, zahira bilan

    # Frontend build natijasi (SPA)
    root /var/www/libosa/frontend/dist;
    index index.html;

    # Django statik fayllari (collectstatic natijasi)
    location /static/ {
        alias /var/www/libosa/backend/staticfiles/;
    }

    # Yuklangan rasmlar / fayllar
    location /media/ {
        alias /var/www/libosa/backend/media/;
    }

    # Django API + admin → gunicorn (URI o'zgarishsiz uzatiladi)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: boshqa hamma so'rovlar index.html ga (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
