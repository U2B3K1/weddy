# Libosa — https://libosa.uz
# frontend/dist statik + /api/, /adminaka/ proxysi gunicorn ga + /static/ va /media/ fayllari.
# Bu faylni serverga qo'yish: /etc/nginx/sites-available/libosa.uz  (keyin symlink)
# academy.libosa.uz — Akademiya: o'sha ilova va o'sha API, lekin server shu hostda faqat o'quv saloni bilan ishlaydi
# (backend/apps/akademiya/host.py). Alohida blok kerak emas; sertifikatga shu nom qo'shiladi (DEPLOY.md §18).

# Cloudflare orqali kelgan so'rovda mijozning haqiqiy IP manzili (DEPLOY.md §19). Busiz hamma foydalanuvchi
# Cloudflare manzili bo'lib ko'rinardi: login himoyasi (IP bo'yicha 5 ta xato) bir odamning xatosi uchun boshqalarni
# ham bloklardi. Faqat Cloudflare manzillariga ishoniladi — boshqa joydan kelgan CF-Connecting-IP sarlavhasi
# e'tiborga olinmaydi (soxtalashtirib bo'lmaydi). Cloudflare'siz to'g'ridan-to'g'ri kelgan so'rovga ta'sir qilmaydi.
# Ro'yxat: https://www.cloudflare.com/ips/ (2026-11-26 holati) — yiliga bir-ikki marta solishtirib turing.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTP → faqat certbot tekshiruvi, qolgani HTTPSga o'tadi.
server {
    listen 80;
    listen [::]:80;
    server_name libosa.uz www.libosa.uz academy.libosa.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name libosa.uz www.libosa.uz academy.libosa.uz;

    # certbot --nginx shu ikki qatorni o'zi to'ldiradi
    ssl_certificate     /etc/letsencrypt/live/libosa.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/libosa.uz/privkey.pem;

    client_max_body_size 20m;   # rasmlar 10MB gacha, zahira bilan

    # Siqish. Ubuntu nginx'ida standart holda faqat HTML siqiladi — JS (≈0,9 MB) va CSS (≈0,4 MB) siqilmasdan ketardi.
    # Bu blok bilan ilova birinchi ochilishda ≈1,3 MB o'rniga ≈0,35 MB yuklanadi (telefon internetida sezilarli).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Xavfsizlik sarlavhalari. nginx qoidasi: `add_header` yozilgan location server darajasidagi sarlavhalarni
    # meros olmaydi — shuning uchun ular har bir location ichida takrorlangan. /api/ va /adminaka/ ga qo'yilmagan:
    # u yerda bularni Django o'zi qo'yadi (ikki marta chiqmasin).
    # Content-Security-Policy: sahifa faqat o'z domenidan skript yuklaydi (begona skript ishlamaydi), shrift — Google Fonts.
    # HSTS muddati Django'dagi HSTS_SONIYA bilan bir xil bo'lsin (.env da oshirilsa, shu yerda ham oshiring).
    # Ramka (iframe): sahifani faqat o'z manzilining o'zi ramkaga ola oladi (SAMEORIGIN / frame-ancestors 'self') —
    # Akademiya dars ekranida ilovani yonidagi ichki oynada ochadi. Begona sayt baribir ramkaga ola olmaydi.

    # Frontend build natijasi (SPA)
    root /var/www/libosa/frontend/dist;
    index index.html;

    # Django statik fayllari (collectstatic natijasi). ^~ — pastdagi rasm/video regex bloki bu yerga tegmasin
    location ^~ /static/ {
        alias /var/www/libosa/backend/staticfiles/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # Yuklangan rasmlar / fayllar
    # Faqat rasm turlari: boshqa kengaytmali fayl (masalan, .html) brauzerda sahifa bo'lib ochilmaydi — yuklab olinadi.
    location ^~ /media/ {
        alias /var/www/libosa/backend/media/;
        types { image/webp webp; image/jpeg jpg jpeg; image/png png; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    }

    # Kesh. Vite build fayllari (/assets/) nomida xesh bor — o'zgarsa nomi ham o'zgaradi, uzoq keshlanadi.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        try_files $uri =404;
    }
    # public/ dagi rasm/video nomlari doimiy (kelinlar/1.jpg, video/qasr.mp4 ...): brauzer har safar ETag bilan
    # tekshiradi (o'zgarmagan bo'lsa 304, qayta yuklanmaydi). Aks holda fayl almashtirilsa ham eski nusxa keshdan chiqadi.
    location ~* \.(?:jpe?g|png|webp|gif|svg|ico|mp4|webm)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        try_files $uri =404;
    }
    # Maxsus manzillar: /.well-known/… va ildizdagi .txt/.json/.xml (robots.txt, llms.txt, sitemap.xml, manifestlar).
    # Fayl bo'lmasa 404 qaytadi — index.html emas: aks holda qidiruv tizimlari va tekshiruvchilar HTML sahifani
    # «buzilgan robots.txt / manifest» deb o'qiydi. Ildizdan chuqurroq manzillarga (masalan, /api/...json) tegmaydi.
    location ^~ /.well-known/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        try_files $uri =404;
    }
    location ~* ^/[^/]+\.(?:txt|json|xml)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        try_files $uri =404;
    }
    # index.html ham har safar tekshiriladi — yangi deploy darhol ko'rinsin
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Django API + admin → gunicorn (URI o'zgarishsiz uzatiladi)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /adminaka/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: boshqa hamma so'rovlar index.html ga (React Router)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
