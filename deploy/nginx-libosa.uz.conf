# Libosa — https://libosa.uz
# frontend/dist statik + /api/, /adminaka/ proxysi gunicorn ga + /static/ va /media/ fayllari.
# Bu faylni serverga qo'yish: /etc/nginx/sites-available/libosa.uz  (keyin symlink)

# HTTP → faqat certbot tekshiruvi, qolgani HTTPSga o'tadi.
server {
    listen 80;
    listen [::]:80;
    server_name libosa.uz www.libosa.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name libosa.uz www.libosa.uz;

    # certbot --nginx shu ikki qatorni o'zi to'ldiradi
    ssl_certificate     /etc/letsencrypt/live/libosa.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/libosa.uz/privkey.pem;

    client_max_body_size 20m;   # rasmlar 10MB gacha, zahira bilan

    # Siqish. Ubuntu nginx'ida standart holda faqat HTML siqiladi — JS (≈0,9 MB) va CSS (≈0,4 MB) siqilmasdan ketardi.
    # Bu blok bilan ilova birinchi ochilishda ≈1,3 MB o'rniga ≈0,35 MB yuklanadi (telefon internetida sezilarli).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Xavfsizlik sarlavhalari. nginx qoidasi: `add_header` yozilgan location server darajasidagi sarlavhalarni
    # meros olmaydi — shuning uchun ular har bir location ichida takrorlangan. /api/ va /adminaka/ ga qo'yilmagan:
    # u yerda bularni Django o'zi qo'yadi (ikki marta chiqmasin).
    # Content-Security-Policy: sahifa faqat o'z domenidan skript yuklaydi (begona skript ishlamaydi), shrift — Google Fonts.
    # HSTS muddati Django'dagi HSTS_SONIYA bilan bir xil bo'lsin (.env da oshirilsa, shu yerda ham oshiring).

    # Frontend build natijasi (SPA)
    root /var/www/libosa/frontend/dist;
    index index.html;

    # Django statik fayllari (collectstatic natijasi). ^~ — pastdagi rasm/video regex bloki bu yerga tegmasin
    location ^~ /static/ {
        alias /var/www/libosa/backend/staticfiles/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # Yuklangan rasmlar / fayllar
    # Faqat rasm turlari: boshqa kengaytmali fayl (masalan, .html) brauzerda sahifa bo'lib ochilmaydi — yuklab olinadi.
    location ^~ /media/ {
        alias /var/www/libosa/backend/media/;
        types { image/webp webp; image/jpeg jpg jpeg; image/png png; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    }

    # Kesh. Vite build fayllari (/assets/) nomida xesh bor — o'zgarsa nomi ham o'zgaradi, uzoq keshlanadi.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        try_files $uri =404;
    }
    # public/ dagi rasm/video nomlari doimiy (kelinlar/1.jpg, video/qasr.mp4 ...): brauzer har safar ETag bilan
    # tekshiradi (o'zgarmagan bo'lsa 304, qayta yuklanmaydi). Aks holda fayl almashtirilsa ham eski nusxa keshdan chiqadi.
    location ~* \.(?:jpe?g|png|webp|gif|svg|ico|mp4|webm)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        try_files $uri =404;
    }
    # index.html ham har safar tekshiriladi — yangi deploy darhol ko'rinsin
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Django API + admin → gunicorn (URI o'zgarishsiz uzatiladi)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /adminaka/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: boshqa hamma so'rovlar index.html ga (React Router)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
